name: ShareExperiment

options:
  bundleIdPrefix: com.jonasleupe
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "9JGPGU9WZ7"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  ShareExperiment:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    entitlements:
      path: App/ShareExperiment.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jonasleupe.ShareExperiment
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonasleupe.ShareExperiment
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Little Dia
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Little Dia listens so you can ask about what you shared by voice. Audio is transcribed on device."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Transcribes your spoken question on device."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - target: ShareExtension
      - sdk: FoundationModels.framework

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
        excludes:
          - AudioProbe.swift
          - ProbeView.swift
      - path: Resources
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jonasleupe.ShareExperiment
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonasleupe.ShareExperiment.ShareExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
    dependencies:
      - sdk: FoundationModels.framework
